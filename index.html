<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="沪教版六至九年级数学讲评工具。选择知识点或用课堂原题，核对学生作答，投屏讲评并准备复测试卷。">
<!-- 分享预览与浏览器标签使用相同标题，离开页面也能看出适用年级。 -->
<meta property="og:title" content="AI 错因诊断与讲评台｜上海六至九年级数学">
<meta property="og:description" content="从学生解题步骤找错因，复核后投屏讲评，再用同类题复测。">
<meta name="theme-color" content="#f2f3fc">
<title>AI 错因诊断与讲评台｜上海六至九年级数学</title>
<style>
  :root{color-scheme:light;--ink:#1c2340;--muted:#545b74;--line:#e0e3f1;--accent:#4333b4;--soft:#ede9ff;--white:#fff;--wash:#f2f3fc;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--wash)}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;line-height:1.5}
  button,input{font:inherit}
  button{cursor:pointer;color:inherit}
  button:disabled{cursor:wait;opacity:.65}
  :focus-visible{outline:3px solid #7358da;outline-offset:3px}
  .wrap{max-width:1200px;width:calc(100% - 72px);margin-inline:auto}
  .masthead{background:#fbfaff;border-bottom:1px solid var(--line)}
  .masthead .wrap{min-height:65px;display:flex;align-items:center;gap:11px;font-size:15px;font-weight:750}
  .mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent);color:white;font-size:20px}
  .hero{padding:38px 0 28px}
  .hero h1{font-size:clamp(28px,3.6vw,45px);line-height:1.14;letter-spacing:-.045em;margin:0 0 11px}
  .hero p{margin:0;color:var(--muted);font-size:15px}
  .workbench{display:grid;grid-template-columns:minmax(295px,325px) minmax(0,1fr);gap:22px;align-items:start;padding-bottom:44px}
  .settings,.preview{background:var(--white);border:1px solid var(--line);border-radius:17px;box-shadow:0 5px 22px #29236608;min-width:0}
  .settings{padding:23px}
  h2{margin:0;font-size:19px;letter-spacing:-.02em}
  fieldset{padding:0;margin:0;border:0;min-width:0}
  .setting{margin-top:24px}
  legend,.field-label{font-weight:700;font-size:14px}
  legend{padding:0;margin-bottom:10px}
  .book-fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .grade-select{display:block;width:100%;height:42px;margin-top:9px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);font:inherit;font-size:14px}
  .topic-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .text-button{padding:3px 4px;border:0;background:none;color:var(--accent);font-weight:650;font-size:13px;min-height:36px}
  .topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .topic{position:relative;display:flex;align-items:center;gap:7px;min-height:43px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;color:#353c59;font-size:13px;cursor:pointer;overflow-wrap:anywhere}
  .topic:has(:checked){border-color:#c6b9ff;background:#f4f0ff;color:#3e28a3;font-weight:650}
  .topic input{accent-color:var(--accent);width:15px;height:15px;flex:none;margin:0}
  .difficulty{display:flex;gap:3px;padding:3px;background:#f2f1f8;border-radius:9px}
  .level{flex:1;position:relative;text-align:center;cursor:pointer}
  .level input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
  .level span{display:block;padding:8px 4px;min-height:38px;border:1px solid transparent;border-radius:7px;color:var(--muted);font-size:13px}
  .level :checked+span{color:var(--accent);font-weight:750;background:white;border-color:#ded9f3;box-shadow:0 1px 2px #28204413}
  .level :focus-visible+span{outline:2px solid #7358da}
  .count-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px}
  .count-range{color:var(--muted);font-size:13px}
  .count{display:grid;grid-template-columns:42px 49px 42px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .count button,.count input{height:40px;background:white;border:0;text-align:center;padding:0}
  .count button{color:var(--accent);font-size:20px;font-weight:650}
  .count button:hover{background:var(--soft)}
  .count input{width:100%;min-width:0;border-inline:1px solid var(--line);font-weight:750;appearance:textfield}
  .count input::-webkit-inner-spin-button,.count input::-webkit-outer-spin-button{appearance:none;margin:0}
  .button{min-height:42px;display:inline-flex;justify-content:center;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;border:1px solid #d9d7ed;background:white;font-size:13px;font-weight:700;white-space:nowrap}
  .button:hover{background:#f3efff}
  .primary{color:white;background:var(--accent);border-color:var(--accent)}
  .primary:hover{background:#382899}
  .generate{width:100%;margin-top:23px;font-size:15px;min-height:46px}
  .form-status{font-size:12px;color:var(--muted);min-height:18px;margin:8px 0 0}
  .form-status[data-error="true"],.export-status[data-error="true"]{color:#a02430}
  .preview{overflow:hidden}
  .preview-header{padding:19px 20px 0}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .exports{display:flex;gap:8px;flex-wrap:wrap}
  .export-status{margin:0;color:var(--muted);font-size:12px}
  .export-status:not(:empty){margin-top:7px}
  .tabs{display:flex;align-items:stretch;gap:25px;margin-top:10px}
  .tab{padding:9px 1px;min-height:42px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:14px;font-weight:650}
  .tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
  .preview-surface{padding:21px 22px 25px;border-top:1px solid var(--line);background:#f7f7fc}
  .paper{max-width:700px;margin-inline:auto;background:white;border:1px solid #e4e5ef;border-radius:6px;padding:27px clamp(19px,4vw,44px) 35px;box-shadow:0 4px 16px #231b5010;color:#222738}
  .paper h3{margin:0;text-align:center;font-size:clamp(21px,2.6vw,28px);letter-spacing:.02em}
  .paper-meta{margin:6px 0 16px;text-align:center;color:#565c70;font-size:13px}
  .identity{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;margin:0 0 12px;border-bottom:1px solid #d7dbe9;padding-bottom:12px;font-size:13px}
  .question-list{padding-left:24px;margin:0}
  .question-list li{padding-left:4px;margin-top:15px}
  .question-list li::marker{font-weight:750}
  .question-text{margin:0;overflow-wrap:anywhere}
  .writing-line{height:18px;border-bottom:1px solid #e1e3eb}
  .solution{margin:7px 0 0;overflow-wrap:anywhere}
  .solution strong{color:#413194}
  .solution-details{margin:4px 0 0;color:#454a60;overflow-wrap:anywhere}
  @media(max-width:910px){
    .wrap{width:calc(100% - 42px)}
    .workbench{grid-template-columns:minmax(260px,290px) minmax(0,1fr);gap:14px}
    .settings,.preview-header{padding-inline:16px}
    .preview-surface{padding-inline:13px}
  }
  @media(max-width:690px){
    .wrap{width:calc(100% - 28px)}
    .masthead .wrap{min-height:56px}
    .hero{padding:26px 0 18px}
    .hero p{font-size:14px}
    .workbench{grid-template-columns:minmax(0,1fr);gap:14px}
    .setting{margin-top:17px}
    .topic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .generate{margin-top:17px}
    .preview-surface{padding:10px 7px 15px}
    .paper{padding:21px 14px 24px}
  }
  @page{size:A4;margin:15mm 17mm}
  @media print{
    :root,body,.preview,.preview-surface,.paper{background:white;color:#000}
    .masthead,.hero,.settings,.preview-header{display:none!important}
    .wrap,.workbench,.preview,.preview-surface,.paper{width:auto;max-width:none;margin:0;padding:0;border:0;border-radius:0;box-shadow:none;display:block;overflow:visible}
    .paper h3{font-size:19pt}
    .paper-meta,.identity{font-size:10pt;color:#222}
    .question-list{font-size:11pt;padding-left:20pt}
    .question-list li{margin-top:10pt;break-inside:avoid}
    .writing-line{height:14pt;border-color:#ccc}
    .solution strong,.solution-details{color:#000}
  }
    [hidden]{display:none!important}
  .tool-nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;padding-block:6px}
  .tool-nav .button{border-color:transparent;background:transparent}
  .tool-nav .button[aria-current="page"]{background:var(--soft);color:var(--accent)}
  /* 背景只铺在诊断页，打印与组卷页面继续使用各自的底色。 */
  body:has(#diagnosis-view:not([hidden])){
    background:
      radial-gradient(ellipse at 91% 340px,#dcebf9 0%,transparent 46%),
      radial-gradient(ellipse at 6% 405px,#e8ddff 0%,transparent 43%),
      #f5f4fb;
    min-height:100vh
  }
  .diagnosis-hero{
    position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;
    min-height:238px;margin:28px 0 22px;padding:32px clamp(24px,4.5vw,55px);border-radius:24px;
    background:
      radial-gradient(ellipse at 95% -18%,#234a80 0%,transparent 46%),
      radial-gradient(ellipse at 68% 105%,#4e378d 0%,transparent 53%),
      linear-gradient(110deg,#121528 25%,#252052 78%,#15243f);
    border:1px solid #535088;box-shadow:0 16px 37px #29205224;color:white
  }
  .diagnosis-hero::before,.diagnosis-hero::after{content:"";position:absolute;pointer-events:none}
  .diagnosis-hero::before{
    inset:0;
    background-image:radial-gradient(circle,#c9c7fb56 1px,transparent 1.5px);
    background-size:19px 19px;
    mask-image:linear-gradient(90deg,transparent 37%,#000 90%)
  }
  .diagnosis-hero::after{
    inset:0;background:linear-gradient(90deg,#121528 0%,#121528d9 29%,transparent 66%);
  }
  .diagnosis-hero-copy{position:relative;z-index:2}
  .diagnosis-hero h1{margin:10px 0 12px;font-size:clamp(26px,3.7vw,45px);letter-spacing:-.04em}
  .diagnosis-hero .diagnosis-course{color:#bdbaf2;font-size:13px;font-weight:680;letter-spacing:.055em}
  .diagnosis-hero .diagnosis-hero-description{color:#e2e0ff;font-size:15px}
  .diagnosis-hero-art{position:absolute;inset:0 0 0 auto;width:57%;pointer-events:none}
  .diagnosis-hero-art::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at 70% 52%,#a281ff69 0%,#6b9ee629 29%,transparent 66%);
    animation:diagnosis-glow 5s ease-out both
  }
  @keyframes diagnosis-glow{
    from{opacity:.35}
    to{opacity:1}
  }
  @media(prefers-reduced-motion:reduce){.diagnosis-hero-art::before{animation:none}}
  .diagnosis-hero-art canvas{position:relative}
  .diagnosis-hero-art canvas{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
  .diagnosis-grid,.projection-grid{display:grid;grid-template-columns:minmax(0,295px) minmax(0,1fr);gap:18px;align-items:start}
  .projection-grid{grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr)}
  .diagnosis-grid{padding-bottom:36px}
  .diagnosis-main{display:grid;gap:16px;min-width:0}
  .diagnosis-grid .diagnosis-card{box-shadow:0 8px 25px #4030740b}
  .diagnosis-context{background:#fbfaff}
  .diagnosis-context .field-label{margin-top:14px}
  .diagnosis-question-controls{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:8px}
  .diagnosis-question-controls select{min-width:0}
  .projection-grid:has(#projection-graph-card[hidden]){grid-template-columns:minmax(0,1fr)}
  #diagnosis-entry-title,.diagnosis-review h2{margin:0}
  #diagnosis-example{padding-inline:9px}
  .diagnosis-card h2{margin-bottom:13px}
  .diagnosis-card p{overflow-wrap:anywhere}
  .diagnosis-card select{margin-top:5px}
  .diagnosis-card label{display:block}
  .diagnosis-card textarea,.diagnosis-field{
    display:block;width:100%;min-width:0;margin:6px 0 10px;padding:9px 11px;border:1px solid #cfd2e5;
    border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:14px
  }
  .diagnosis-card textarea{resize:vertical;min-height:64px}
  #diagnosis-input{
    min-height:104px;margin:0;padding:13px 15px;border:0;border-radius:13px 13px 0 0;
    background:transparent;color:#1b2040;font-size:15px
  }
  #diagnosis-input:focus-visible{outline:none}
  .diagnosis-composer{
    overflow:hidden;margin-top:9px;border:1px solid #b8a9ee;border-radius:15px;
    background:linear-gradient(145deg,#f8f5ff,#fff 53%,#f5faff);box-shadow:0 3px 14px #5442a10e
  }
  .diagnosis-composer:focus-within{border-color:#7358da;box-shadow:0 0 0 3px #ebe4ff}
  .diagnosis-composer-bar{
    display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;
    min-height:59px;padding:7px 10px 8px 14px;border-top:1px solid #eae4fa;background:#f8f5ff
  }
  .diagnosis-composer-bar .button{
    margin-left:auto;padding-inline:15px;background:linear-gradient(120deg,#593fc5,#3d50b8);
    box-shadow:0 3px 9px #5d48ba33
  }
  .diagnosis-composer-bar .button:hover{background:#4026a3}
  .diagnosis-spark{color:#ebe0ff;font-size:17px;line-height:1}
  #diagnosis-entry-title+button:hover{background:#f3eeff;border-radius:8px}
  .diagnosis-problem{padding:12px 14px;margin:14px 0;background:#f7f6fd;border-radius:9px}
  .diagnosis-problem p{margin:0}
  .diagnosis-problem details{margin-top:10px;font-size:14px}
  .diagnosis-problem summary{color:var(--accent);cursor:pointer;font-weight:700}
  .diagnosis-problem details p{margin-top:6px}
  .diagnosis-note{font-size:13px;color:var(--muted);margin:0}
  .diagnosis-actions{display:flex;gap:8px;flex-wrap:wrap}
  #diagnosis-status:empty,#diagnosis-transfer-status:empty{display:none}
  .diagnosis-transfer{margin-top:13px}
  .diagnosis-transfer summary{color:var(--muted);cursor:pointer;font-size:13px;font-weight:650}
  .diagnosis-transfer[open] summary{color:var(--accent)}
  .diagnosis-transfer-body{margin-top:9px;padding:13px;border-radius:10px;background:#f7f5fd}
  .diagnosis-transfer-body hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  .diagnosis-transfer-body p+button{margin-top:8px}
  .diagnosis-transfer label{margin-top:12px}
  .diagnosis-retest{margin:18px 0 38px}
  .diagnosis-review{border-color:#dcd1f8}
  .diagnosis-review .toolbar p{margin-top:3px}
  .diagnosis-tally{padding:11px 13px;background:var(--soft);border-radius:8px;color:#362a7a;font-size:14px}
  .diagnosis-cards{display:grid;gap:11px}
  .diagnosis-case{padding:13px 14px;border:1px solid var(--line);border-radius:12px;min-width:0}
  .diagnosis-case-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:8px}
  .diagnosis-case-body .diagnosis-original{margin-top:3px}
  .diagnosis-case-body label{font-size:13px}
  .diagnosis-case-body .diagnosis-field{margin-top:3px}
  .diagnosis-case h3,.projection-case h3{font-size:16px;margin:0}
  .diagnosis-original{margin:8px 0 12px;padding:10px 12px;border-left:3px solid #9f8ae7;background:#f7f5fd;white-space:pre-wrap;overflow-wrap:anywhere}
  .diagnosis-evidence{margin:0 0 10px;font-size:13px;color:var(--muted);white-space:pre-wrap}
  .diagnosis-original mark{background:#e9dcff;color:inherit;border-radius:3px}
  .diagnosis-case .case-toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px;min-height:32px}
  .case-toggle input{accent-color:var(--accent);width:16px;height:16px}
  .projection .hero .button{margin-bottom:13px}
  .projection-cases{display:grid;gap:12px}
  .projection-case{padding:13px 15px;border:1px solid var(--line);border-radius:10px;min-width:0}
  .projection-case .diagnosis-original{font-size:clamp(16px,2vw,23px)}
  .projection-case p{margin:8px 0 0}
  .diagnosis-graph svg{display:block;width:100%;height:auto;margin-bottom:10px;border-radius:8px;background:#f8f7ff}
  .diagnosis-graph+.diagnosis-actions{margin-bottom:7px}
  [data-graph-focus][aria-pressed="true"]{background:var(--soft);color:var(--accent);border-color:#b9a9f0}
  @media(max-width:850px){
    .diagnosis-hero-art{width:51%;opacity:.82}
    .diagnosis-grid{grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:13px}
    .diagnosis-case-body{grid-template-columns:minmax(0,1fr);gap:4px}
  }
  @media(max-width:690px){
    .masthead .wrap{gap:6px}.masthead .mark{display:none}
    .tool-nav{gap:1px}.tool-nav .button{padding-inline:7px}
    .diagnosis-hero{min-height:0;margin:14px 0 12px;padding:19px 16px;border-radius:16px}
    .diagnosis-hero h1{margin:6px 0}
    .diagnosis-hero .diagnosis-course,.diagnosis-hero .diagnosis-hero-description{font-size:12px}
    .diagnosis-hero-art{width:57%;opacity:.52}
    .diagnosis-hero::after{background:linear-gradient(90deg,#121528 5%,#121528b0 47%,transparent)}
    .diagnosis-grid,.projection-grid{grid-template-columns:minmax(0,1fr)}
    .diagnosis-grid,.projection-grid{gap:12px}
    .diagnosis-main{gap:12px}
    .diagnosis-context h2{margin-bottom:3px}
    .diagnosis-context .field-label{margin-top:7px}
    .diagnosis-problem{margin:9px 0;padding:9px 11px;font-size:14px}
    .diagnosis-card{padding-block:14px}
    #diagnosis-input{min-height:82px}
  }
  @media print{
    #diagnosis-view,#diagnosis-projection{display:none!important}
  }

</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <span class="mark" aria-hidden="true">∑</span><span>数学教师工具</span>
    <nav class="tool-nav" aria-label="教师工具">
      <button class="button" id="open-diagnosis" type="button" aria-current="page">诊断与讲评</button>
      <button class="button" id="open-paper" type="button">试卷生成</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <!-- 诊断是默认首页；组卷预览仍在同一页，方便打印后返回复核。 -->
  <div id="paper-view" hidden>
  <section class="hero" aria-labelledby="title">
    <h1 id="title" tabindex="-1">六至九年级数学出题工具</h1>
    <p>上海教育出版社 · 五·四学制。按册次和知识点生成学生卷及答案解析。</p>
  </section>
  <div class="workbench">
    <form class="settings" id="settings">
      <h2>出题设置</h2>
      <div class="setting book-fields">
        <div>
          <label class="field-label" for="grade">年级</label>
          <select class="grade-select" id="grade" name="grade">
            <option value="6">六年级</option>
            <option value="7">七年级</option>
            <option value="8">八年级</option>
            <option value="9">九年级</option>
          </select>
        </div>
        <div>
          <label class="field-label" for="term">册次</label>
          <select class="grade-select" id="term" name="term">
            <option>上册</option>
            <option>下册</option>
            <option>上下册</option>
          </select>
        </div>
      </div>
      <fieldset class="setting" aria-labelledby="topic-label">
        <div class="topic-top">
          <span class="field-label" id="topic-label">知识点</span>
          <button class="text-button" type="button" id="all-topics">全选</button>
        </div>
        <div class="topic-grid" id="topics"></div>
      </fieldset>
      <fieldset class="setting">
        <legend>难度</legend>
        <div class="difficulty">
          <label class="level"><input type="radio" name="difficulty" value="basic"><span>基础</span></label>
          <label class="level"><input type="radio" name="difficulty" value="standard" checked><span>标准</span></label>
          <label class="level"><input type="radio" name="difficulty" value="advanced"><span>提高</span></label>
        </div>
      </fieldset>
      <div class="setting">
        <label class="field-label" for="count">题量</label>
        <div class="count-row">
          <span class="count-range">1–30 道</span>
          <div class="count">
            <button type="button" aria-label="减少一题" data-step="-1">−</button>
            <input id="count" name="count" type="number" min="1" max="30" step="1" value="10" inputmode="numeric" required>
            <button type="button" aria-label="增加一题" data-step="1">＋</button>
          </div>
        </div>
      </div>
      <button class="button primary generate" type="submit">生成新试卷</button>
      <p class="form-status" id="form-status" role="status"></p>
    </form>
    <section class="preview" aria-labelledby="preview-title">
      <div class="preview-header">
        <div class="toolbar">
          <h2 id="preview-title">试卷预览</h2>
          <div class="exports">
            <button class="button" id="print" type="button">打印学生卷</button>
            <button class="button primary" id="download" type="button">下载学生卷 PDF</button>
          </div>

    generate(difficulty) {
      const level = labelFor[difficulty];

  return [
    template("rational", "有理数", "上册", level => {
      const a = number(2, 27), b = number(2, 18), c = number(2, 9);

        return [`计算：(${-a}) + ${b}。`, b - a, `异号两数相加，用绝对值较大的数减较小的数并保留较大绝对值的数的符号。结果是 ${b - a}。`, { type: "sign", negative: -a, positive: b }];
      }
      if (level === 1) {
        return [`计算：(${-a}) × ${b} − (${-c})。`, -a * b + c, `先乘得 ${-a * b}，再把减去负数转成加上 ${c}，得 ${-a * b + c}。`];
      }
      return [`计算：(${-a}) + (${-c})² − ${b} × (${-c})。`, -a + c * c + b * c,

    }),
    template("expression", "简单的代数式", "上册", level => {
      const a = number(2, 22), b = number(1, 19), x = -number(2, 13);
      if (level === 0) {
        return [`当 x = ${x} 时，求 ${a}x + ${b} 的值。`, a * x + b, `把 x = ${x} 代入，得到 ${a} × ${signed(x)} + ${b} = ${a * x + b}。`];
      }
      if (level === 1) {
        return [`合并同类项：${a}x + ${b} + ${b}x − ${a + b}。`, `${a + b}x − ${a}`,

      }
      return [`先化简，再求值：${a}(x + ${b}) − ${a + b}(x − 1)，其中 x = ${x}。`,
        -b * x + a * b + a + b,
        `去括号并合并同类项得 −${b}x + ${a * b + a + b}。代入 x = ${x} 得 ${-b * x + a * b + a + b}。`];
    }),
    template("equation", "一元一次方程", "上册", level => {
      const a = number(2, 18), b = number(2, 24), x = number(2, 20);
      if (level === 0) {
        return [`解方程：${a}x + ${b} = ${a * x + b}。`, `x = ${x}`, `两边减 ${b} 得 ${a}x = ${a * x}，再同除以 ${a}。`];
      }
      if (level === 1) {
        return [`解方程：${a}(x + ${b}) = ${a - 1}x + ${x + a * b}。`, `x = ${x}`,

      }
      return [`某次活动中，${a} 个相同价位的单人票加一张 ${b} 元的材料券，总价与 ${a - 1} 张同价单人票加一张 ${b + x} 元的组合材料券相同。单人票多少钱？`,
        `${x} 元`, `设单人票 x 元，列式 ${a}x + ${b} = ${a - 1}x + ${b + x}，移项后得 x = ${x}。`];
    }),
    template("segments-angles", "线段与角", "上册", level => {
      const a = number(3, 35), b = number(3, 30), c = number(15, 85);
      if (level === 0) {
        return [`点 B 在线段 AC 上，AB = ${a} cm，BC = ${b} cm。求 AC。`, `${a + b} cm`, `B 在线段 AC 上，所以 AC = AB + BC = ${a + b} cm。`];
      }
      if (level === 1) {
        return [`射线 OC 在 ∠AOB 内部，∠AOB = ${c + b}°，∠AOC = ${c}°。求 ∠COB。`, `${b}°`,

        `${a + 2 * b}°`, `角平分后 ∠AOC = ∠COB = ${a + b}°。∠DOC = ${b}°，所以 ∠DOB = ${b}° + ${a + b}° = ${a + 2 * b}°。`];
    }),
    template("proportion", "比与比例", "下册", level => {
      const a = number(2, 19), b = number(2, 14), units = number(4, 22), price = number(8, 35);
      if (level === 0) {
        return [`红球与蓝球的个数比为 ${a}∶${b}，红球有 ${a * units} 个。蓝球有多少个？`, `${b * units} 个`,
          `每份有 ${a * units} ÷ ${a} = ${units} 个。蓝球占 ${b} 份，共 ${b * units} 个。`];
      }
      if (level === 1) {
        return [`一件标价 ${price * 10} 元的商品按标价的 ${units + 65}% 销售。售价是多少？`, `${price * (units + 65) / 10} 元`,
          `以标价为单位 1，售价 = ${price * 10} × ${units + 65}% = ${price * (units + 65) / 10} 元。`];
      }
      return [`两个班共 ${(a + b) * units} 人，人数之比为 ${a}∶${b}。两个班各有 ${units} 人参加活动。两班未参加活动的人数比是多少？`,
        `${a - 1}∶${b - 1}`, `按比求得两班各有 ${a * units} 和 ${b * units} 人。各减 ${units} 后，再同除以 ${units}，得到 ${a - 1}∶${b - 1}。`];
    }),
    template("circle-sector", "圆与扇形", "下册", level => {
      const r = number(2, 53), d = number(2, 8), n = number(1, d - 1);
      if (level === 0) {
        return [`一个圆的半径为 ${r} cm，求周长（保留 π）。`, `${2 * r}π cm`, `用周长公式 2πr，代入 r = ${r}，得 ${2 * r}π cm。`];
      }
      if (level === 1) {
        return [`扇形半径为 ${r} cm，圆心角占周角的 ${n}/${d}。求扇形面积（保留 π）。`, `(${n * r * r}/${d})π cm²`,
          `扇形面积占对应整圆面积的 ${n}/${d}，所以面积为 (${n * r * r}/${d})π cm²。`];
      }
      return [`圆心角为 90° 的扇形，其半径为 ${r} cm。求扇形的周长（保留 π）。`,
        `(2 × ${r} + ${r}π/2) cm`, `弧长等于圆周长的 1/4，即 ${r}π/2 cm。扇形周长还要加上两条半径，共 (2 × ${r} + ${r}π/2) cm。`];
    }),
    template("data-chance", "可能性与统计图表", "下册", level => {
      const a = number(2, 13), b = a + number(1, 14), t = number(3, 8), m = number(1, 15);
      if (level === 0) {
        return [`袋中有 ${a} 个白球和 ${b} 个红球，除颜色外完全相同。随机摸出 1 个球，摸到哪种颜色的可能性更大？`,
          "红色", `每个球被摸到的机会相同，红球个数 ${b} 大于白球个数 ${a}。`];
      }
      if (level === 1) {
        return [`某年级调查了 ${20 * t} 名学生，其中 ${m * t} 人最喜欢羽毛球。制作扇形统计图时，羽毛球对应的百分比是多少？`,
          `${m * 5}%`, `分项人数除以总人数，即 ${m * t} ÷ ${20 * t} = ${m * 5}%。`];
      }
      return [`甲组共 ${a * 10} 人，有 40% 选甲方案；乙组共 ${b * 10} 人，有 60% 选甲方案。两组合计有多少人选甲方案？`,
        `${4 * a + 6 * b} 人`, `甲组有 ${a * 10} × 40% = ${4 * a} 人，乙组有 ${b * 10} × 60% = ${6 * b} 人，合计 ${4 * a + 6 * b} 人。`];
    }),
    template("cylinder-cone", "圆柱与圆锥", "下册", level => {
      const r = number(2, 25), h = number(2, 29), s = r + number(1, 18);
      if (level === 0) {
        return [`底面半径为 ${r} cm、高为 ${h} cm 的直圆柱沿一条母线剪开侧面。所得长方形的两边分别是多少（保留 π）？`,
          `${2 * r}π cm、${h} cm`, `两边分别等于底面周长 2πr 和圆柱的高。`];
      }
      if (level === 1) {
        return [`直圆锥的母线长为 ${s} cm，底面半径为 ${r} cm。侧面展开成扇形后，弧长和扇形半径分别是多少（保留 π）？`,
          `${2 * r}π cm、${s} cm`, `弧长等于底面周长 2πr，扇形半径等于母线长。`];
      }
      return [`直圆锥的底面半径为 ${r} cm，母线长为 ${s} cm。侧面展开后，扇形面积占同半径整圆面积的几分之几？`,
        `${r}/${s}`, `扇形面积比例等于弧长比例。用底面周长 2π×${r} 除以展开图对应整圆的周长 2π×${s}，得到 ${r}/${s}。`];
    }),
    template("equation-system", "二元一次方程组", "下册", level => {
      const x = number(2, 23), y = number(1, x - 1), k = number(2, 6);
      if (level === 0) {
        return [`解方程组：x + y = ${x + y}，x − y = ${x - y}。`, `x = ${x}，y = ${y}`,
          `两式相加消去 y，得 2x = ${2 * x}。把 x = ${x} 代入第一式求得 y = ${y}。`];
      }
      if (level === 1) {
        return [`解方程组：${k}x + y = ${k * x + y}，x + y = ${x + y}。`, `x = ${x}，y = ${y}`,
          `第一式减第二式，得 ${k - 1}x = ${(k - 1) * x}。解出 x 后代入第二式。`];
      }
      return [`学校共购入 ${x + y} 套器材，其中 A 套装 ${k + 4} 元/套，B 套装 4 元/套，总价 ${(k + 4) * x + 4 * y} 元。各购入多少套？`,
        `A 套装 ${x} 套，B 套装 ${y} 套`,
        `设两种套装分别为 x、y 套，列 x + y = ${x + y}，${k + 4}x + 4y = ${(k + 4) * x + 4 * y}。第二式减第一式的 4 倍，得 ${k}x = ${k * x}，进而求出 y。`];
    })
  ];
})();

function shufflePaperItems(items) {
  const shuffled = [...items];
  for (let index = shuffled.length - 1; index > 0; index--) {
    const pick = Math.floor(Math.random() * (index + 1));
    [shuffled[index], shuffled[pick]] = [shuffled[pick], shuffled[index]];
  }
  return shuffled;
}

const GRADE_7 = (() => {
  const integer = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
  const pick = (items) => items[integer(0, items.length - 1)];
  const grouped = (number) => number < 0 ? `(${number})` : String(number);
  const result = (prompt, answer, explanation, lines = 2) => ({ prompt, answer: String(answer), explanation, lines });
  const power = (value) => [...String(value)].map((digit) => '⁰¹²³⁴⁵⁶⁷⁸⁹'[Number(digit)]).join('');

  // 化简结果省略系数 1 和零常数项，符合卷面书写习惯。
  function linear(coefficient, offset) {
    const variable = coefficient === 1 ? 'x' : `${coefficient}x`;
    if (offset === 0) return variable;
    return `${variable} ${offset < 0 ? '−' : '+'} ${Math.abs(offset)}`;
  }

  // 先取整数量和答案，再按数学关系构造题面，避免碰巧生成无解、重根或小数过长的题。
  function topic(id, label, term, generators) {
    return {
      id,
      label,
      term,
      generate(difficulty) {
        return { topic: id, ...pick(generators[difficulty])() };
      },
    };
  }

  return [
    topic('g7-algebra', '整式的加减', '上册', {
      basic: [
        () => {
          const a = integer(2, 12), b = integer(2, 12), c = integer(2, 9);
          return result(`合并同类项：${a}x + ${b}x + ${c}。`, `${a + b}x + ${c}`, `同类项 ${a}x 与 ${b}x 的系数相加，字母部分保留，结果是 ${a + b}x + ${c}。`, 1);
        },
        () => {
          const a = integer(2, 9), b = integer(3, 19), x = integer(-5, 8);
          return result(`当 x = ${x} 时，求 ${a}x + ${b} 的值。`, a * x + b, `代入 x 得 ${a} × ${grouped(x)} + ${b} = ${a * x + b}。`, 1);
        },
      ],
      standard: [
        () => {
          const a = integer(5, 13), b = integer(2, a - 1), c = integer(2, 12), d = integer(2, 14);
          const answer = linear(a - b, c + d);

        },
        () => {
          const a = integer(2, 8), b = integer(2, 11), c = integer(2, 8), d = integer(2, 14);
          const answer = linear(a * b, d - a * c);
          return result(`化简 ${a}(${b}x − ${c}) + ${d}。`, answer, `用分配律去括号得到 ${a * b}x − ${a * c} + ${d}，合并常数项得 ${answer}。`);
        },
      ],
      advanced: [

function makePaperPdf(paper, mode) {
  const isAnswerSheet = mode === 'answers';
  const pageWidth = 595;
  const pageHeight = 842;
  const margin = 46;
  const rightEdge = pageWidth - margin;
  const contentBottom = pageHeight - 57;
  const canvas = document.createElement('canvas');
  canvas.width = pageWidth * 2;
  canvas.height = pageHeight * 2;
  const context = canvas.getContext('2d', { alpha: false });
  const fonts = '"PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Heiti SC", sans-serif';
  const pageImages = [];
  let pageNumber = 0;
  let cursor = 0;

  function setFont(size, weight) {
    context.font = `${weight} ${size}px ${fonts}`;
  }

  function write(text, x, y, size, weight = 400, color = '#182325') {
    setFont(size, weight);
    context.fillStyle = color;
    context.fillText(text, x, y);
  }

  function rule(x1, x2, y, color = '#b4c0be') {
    context.strokeStyle = color;
    context.lineWidth = 0.65;
    context.beginPath();
    context.moveTo(x1, y);
    context.lineTo(x2, y);
    context.stroke();
  }

  function wrap(text, width, size, weight = 400) {
    setFont(size, weight);
    return String(text).split(/\r?\n/).flatMap(paragraph => {
      const lines = [];
      let line = '';
      // 尽量在词组之间换行，中文和超长算式可按字符断开。
      for (const part of paragraph.match(/[a-zA-Z0-9]+(?:[./%][a-zA-Z0-9]+)*%?|./gu) || []) {
        if (line && context.measureText(line + part).width > width) {
          lines.push(line.trimEnd());
          line = '';
        }
        for (const character of part) {
          if (line && context.measureText(line + character).width > width) {
            lines.push(line.trimEnd());
            line = '';
          }
          if (line || character.trim()) line += character;
        }
      }
      lines.push(line);
      return lines;
    });
  }

  function startPage() {
    pageNumber += 1;
    context.setTransform(2, 0, 0, 2, 0, 0);
    context.fillStyle = '#ffffff';
    context.fillRect(0, 0, pageWidth, pageHeight);
    context.textBaseline = 'top';
    const label = isAnswerSheet ? '答案与解析' : '学生卷';
    if (pageNumber === 1) {
      write(label, margin, 43, 10, 600, '#285852');
      const title = wrap(paper.title, rightEdge - margin, 25, 700);
      title.forEach((line, index) => write(line, margin, 61 + index * 31, 25, 700));
      const metaY = 64 + title.length * 31;
      const details = [paper.bookLabel, paper.difficultyLabel, `共 ${paper.questions.length} 道题`].filter(Boolean);
      write(details.join('   ·   '), margin, metaY, 10.5, 400, '#4d5c5a');
      if (!isAnswerSheet) {
        write('班级', margin, metaY + 26, 10.5);
        rule(margin + 27, margin + 126, metaY + 40);
        write('姓名', margin + 149, metaY + 26, 10.5);
        rule(margin + 176, margin + 275, metaY + 40);
        write('日期', margin + 298, metaY + 26, 10.5);
        rule(margin + 325, rightEdge, metaY + 40);
      }
      cursor = metaY + (isAnswerSheet ? 27 : 54);
    } else {
      const title = wrap(`${paper.title} · ${label}`, rightEdge - margin, 11, 600);
      title.forEach((line, index) => write(line, margin, 39 + index * 16, 11, 600));
      cursor = 44 + title.length * 16;
    }
    rule(margin, rightEdge, cursor);
    cursor += 18;
  }

  function savePage() {
    rule(margin, rightEdge, pageHeight - 43, '#dce4e2');
    const footer = `第 ${pageNumber} 页`;
    setFont(9, 400);
    write(footer, (pageWidth - context.measureText(footer).width) / 2, pageHeight - 31, 9, 400, '#4d5c5a');
    // 每一页先转为 JPEG，再复用同一画布，避免手机同时持有多张大画布。
    const base64 = canvas.toDataURL('image/jpeg', 0.92).split(',')[1];
    pageImages.push(Uint8Array.from(atob(base64), character => character.charCodeAt(0)));
  }

  startPage();
  paper.questions.forEach((question, index) => {
    const textX = margin + 30;
    const textWidth = rightEdge - textX;
    const prompts = wrap(question.prompt, textWidth, 12, 600);
    const answers = isAnswerSheet ? wrap(`答案  ${question.answer}`, textWidth, 11.5, 600) : [];
    const explanations = isAnswerSheet ? wrap(`解析  ${question.explanation}`, textWidth, 11) : [];
    const answerLines = Math.max(1, Math.min(4, Number(question.lines) || 1));
    const blockHeight = prompts.length * 19 + (isAnswerSheet
      ? 5 + answers.length * 18 + explanations.length * 17
      : 5 + answerLines * 24) + 15;

    // 整题移到下一页，避免题干和解析或作答区被分页切开。
    if (cursor + blockHeight > contentBottom) {
      savePage();
      startPage();
    }

    write(`${index + 1}.`, margin, cursor, 11.5, 700, '#285852');
    for (const line of prompts) {
      write(line, textX, cursor, 12, 600);
      cursor += 19;
    }
    cursor += 5;
    if (isAnswerSheet) {
      for (const line of answers) {
        write(line, textX, cursor, 11.5, 600, '#285852');
        cursor += 18;
      }
      for (const line of explanations) {
        write(line, textX, cursor, 11);
        cursor += 17;
      }
    } else {
      for (let line = 0; line < answerLines; line += 1) {
        rule(textX, rightEdge, cursor + 18, '#aebbb8');
        cursor += 24;
      }
    }
    cursor += 15;
  });
  savePage();

  const imageWidth = canvas.width;
  const imageHeight = canvas.height;
  canvas.width = 0;
  canvas.height = 0;
  const encoder = new TextEncoder();
  const parts = [];
  const offsets = [0];
  let byteCount = 0;

  function append(value) {
    const bytes = typeof value === 'string' ? encoder.encode(value) : value;
    parts.push(bytes);
    byteCount += bytes.length;
  }

  function writeObject(id, dictionary, stream) {
    offsets[id] = byteCount;
    append(`${id} 0 obj\n${dictionary}`);
    if (stream) {
      append('\nstream\n');
      append(stream);
      append('\nendstream');
    }
    append('\nendobj\n');
  }

  // PDF 的交叉引用表按字节定位，图片流长度与偏移量都按二进制计算。
  append('%PDF-1.4\n');
  append(new Uint8Array([37, 226, 227, 207, 211, 10]));
  const pages = pageImages.map((_, index) => `${3 + index * 3} 0 R`).join(' ');
  writeObject(1, '<< /Type /Catalog /Pages 2 0 R >>');
  writeObject(2, `<< /Type /Pages /Kids [${pages}] /Count ${pageImages.length} >>`);
  const placement = encoder.encode('q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n');
  pageImages.forEach((image, index) => {
    const page = 3 + index * 3;
    writeObject(page, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${page + 2} 0 R >> >> /Contents ${page + 1} 0 R >>`);
    writeObject(page + 1, `<< /Length ${placement.length} >>`, placement);
    writeObject(page + 2, `<< /Type /XObject /Subtype /Image /Width ${imageWidth} /Height ${imageHeight} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${image.length} >>`, image);
  });
  const tableStart = byteCount;
  append(`xref\n0 ${offsets.length}\n0000000000 65535 f \n`);
  offsets.slice(1).forEach(offset => append(`${String(offset).padStart(10, '0')} 00000 n \n`));
  append(`trailer\n<< /Size ${offsets.length} /Root 1 0 R >>\nstartxref\n${tableStart}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}


const form = document.getElementById("settings");
const gradeInput = document.getElementById("grade");
const termInput = document.getElementById("term");
const topics = document.getElementById("topics");
const countInput = document.getElementById("count");
const selectAll = document.getElementById("all-topics");
const formStatus = document.getElementById("form-status");
const exportStatus = document.getElementById("export-status");
const preview = document.getElementById("paper");
const printButton = document.getElementById("print");
const downloadButton = document.getElementById("download");
const tabs = Array.from(document.querySelectorAll("[role=tab]"));
const levels = { basic: "基础", standard: "标准", advanced: "提高" };
const modes = { student: "学生卷", answers: "答案解析" };
const grades = { 6: GRADE_6, 7: GRADE_7, 8: GRADE_8, 9: GRADE_9 };
let paper;
let mode = "student";

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function availableTopics() {
  const topicsForGrade = grades[gradeInput.value];
  return termInput.value === "上下册" ? topicsForGrade : topicsForGrade.filter(topic => topic.term === termInput.value);
}

function renderTopics() {
  const options = availableTopics().map((topic, index) => {
    const option = element("label", "topic");
    const input = element("input");
    input.type = "checkbox";
    input.name = "topic";
    input.value = topic.id;
    input.checked = index < 3;
    option.append(input, element("span", "", topic.label));
    return option;
  });
  topics.replaceChildren(...options);
  updateSelectAll();
}

function generatePaperQuestions(topicIds, difficulty, count) {
  const selected = shufflePaperItems(availableTopics().filter(topic => topicIds.includes(topic.id)));
  const prompts = new Set();
  const questions = [];
  for (let index = 0; index < count; index++) {
    // 轮流从所选知识点取题，题量足够时每个知识点都能覆盖。
    const topic = selected[index % selected.length];
    for (let attempt = 0; attempt < 200; attempt++) {
      const question = topic.generate(difficulty);
      if (prompts.has(question.prompt)) continue;
      questions.push(question);
      prompts.add(question.prompt);
      break;
    }
  }
  return shufflePaperItems(questions);
}

function updateSelectAll() {
  selectAll.textContent = Array.from(topics.querySelectorAll("input")).every(input => input.checked) ? "取消全选" : "全选";
}

function showFormStatus(message, error = false) {
  formStatus.textContent = message;
  formStatus.dataset.error = String(error);
}

function updateSettings() {
  updateSelectAll();
  showFormStatus("点击「生成新试卷」应用设置。");
}

function renderPaper() {
  const answerMode = mode === "answers";
  const heading = element("h3", "", answerMode ? paper.title + " · 答案解析" : paper.title);
  const details = [paper.bookLabel, paper.difficultyLabel && paper.difficultyLabel + "难度", `共 ${paper.questions.length} 题`];
  const meta = element("p", "paper-meta", details.filter(Boolean).join(" · "));
  const content = [heading, meta];

  // 试卷和答案使用同一组题，切换视图不会重新生成或改变题号。
  if (!answerMode) {
    const identity = element("p", "identity");
    for (const label of ["姓名 ____________", "班级 ____________", "日期 ____________"]) {
      identity.append(element("span", "", label));
    }
    content.push(identity);
  }

  const list = element("ol", "question-list");
  for (const question of paper.questions) {
    const item = element("li");
    item.append(element("p", "question-text", question.prompt));
    if (answerMode) {
      const solution = element("p", "solution");
      solution.append(element("strong", "", "答案　"), document.createTextNode(question.answer));
      item.append(solution, element("p", "solution-details", question.explanation));
    } else {
      for (let index = 0; index < question.lines; index++) {
        const line = element("div", "writing-line");
        line.setAttribute("aria-hidden", "true");
        item.append(line);
      }
    }
    list.append(item);
  }
  content.push(list);
  preview.replaceChildren(...content);
  preview.setAttribute("aria-labelledby", "tab-" + mode);
  for (const tab of tabs) {
    const selected = tab.dataset.mode === mode;
    tab.setAttribute("aria-selected", String(selected));
    tab.tabIndex = selected ? 0 : -1;
  }
  printButton.textContent = "打印" + modes[mode];
  downloadButton.textContent = "下载" + modes[mode] + " PDF";
  exportStatus.textContent = "";
}

function createPaper() {
  const settings = new FormData(form);
  const selectedTopics = settings.getAll("topic");
  if (!selectedTopics.length) {
    showFormStatus("请至少选择一个知识点。", true);
    topics.querySelector("input").focus();
    return;
  }
  const difficulty = settings.get("difficulty");
  const gradeLabel = gradeInput.selectedOptions[0].textContent;
  const count = countInput.valueAsNumber;
  const questions = generatePaperQuestions(selectedTopics, difficulty, count);
  if (questions.length !== count) {
    showFormStatus("本次未能生成指定题量，请再试一次。", true);
    return;
  }
  paper = {
    title: gradeLabel + "数学小测",
    bookLabel: "沪教版五·四学制 " + termInput.value,
    difficultyLabel: levels[difficulty],
    questions
  };
  mode = "student";
  renderPaper();
  const topicCount = new Set(questions.map(question => question.topic)).size;
  showFormStatus(`已生成 ${questions.length} 道题，覆盖 ${topicCount} 个知识点。`);
}

// 切换年级或册次时重建选项，避免上一本书的知识点混入新试卷。
for (const bookInput of [gradeInput, termInput]) {
  bookInput.addEventListener("change", () => {
    renderTopics();
    updateSettings();
  });
}
form.addEventListener("input", updateSettings);
form.addEventListener("submit", event => {
  event.preventDefault();
  createPaper();
});
selectAll.addEventListener("click", () => {
  const inputs = Array.from(topics.querySelectorAll("input"));
  const select = !inputs.every(input => input.checked);
  for (const input of inputs) input.checked = select;
  updateSettings();
});
for (const button of form.querySelectorAll("[data-step]")) {
  button.addEventListener("click", () => {
    countInput.value = String(Math.min(30, Math.max(1, (countInput.valueAsNumber || 10) + Number(button.dataset.step))));
    updateSettings();
  });
}
for (const tab of tabs) {
  tab.addEventListener("click", () => {
    mode = tab.dataset.mode;
    renderPaper();
  });
  tab.addEventListener("keydown", event => {
    if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
    event.preventDefault();
    const target = event.key === "Home" ? tabs[0] : event.key === "End" ? tabs[1] : tabs.find(item => item !== tab);
    target.click();
    target.focus();
  });
}

// 页面始终只挂载一种文档，浏览器打印时也只会打印当前预览。
printButton.addEventListener("click", () => window.print());
downloadButton.addEventListener("click", () => {
  const currentMode = mode;
  const currentPaper = paper;
  downloadButton.disabled = true;
  exportStatus.dataset.error = "false";
  exportStatus.textContent = "正在准备 PDF…";
  // 捕获当前试卷和选中的版本，避免生成期间切换预览造成文件名与内容错配。
  setTimeout(() => {
    try {
      const file = makePaperPdf(currentPaper, currentMode);
      const url = URL.createObjectURL(file);
      const link = element("a");
      link.href = url;
      link.download = currentPaper.title + "-" + modes[currentMode] + ".pdf";
      document.body.append(link);
      link.click();
      link.remove();
      // 保留临时地址一段时间，让手机浏览器有时间读取文件。
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      exportStatus.textContent = "PDF 已生成。";
    } catch {
      exportStatus.dataset.error = "true";
      exportStatus.textContent = "无法生成 PDF，请使用打印按钮或换浏览器重试。";
    } finally {
      downloadButton.disabled = false;
    }
  }, 0);
});

renderTopics();
createPaper();

  };

    byId("diagnosis-check-label").textContent = checks ? "分析作答" : "开始复核";
    drawHeroPlot();
  }

  function drawHeroPlot() {
    const canvas = byId("diagnosis-hero-plot");
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    // 没有题目图像时用开口向下的通用背景，投屏只展示题目实际提供的图像。
    const { a, b, c } = question?.graph ?? { a: -1, b: 0, c: 1 };
    const vertex = -b / (2 * a);
    const halfSpan = Math.sqrt(b * b - 4 * a * c) / (2 * Math.abs(a));
    const direction = Math.sign(a);
    const px = relative => 472 + 171 * relative;
    const py = relative => 202 + 101 * direction * (1 - relative ** 2);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 题目变化时更新示意图的开口方向，按零点与顶点的相对距离绘制，装饰图不显示数值答案。
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#bcb5fc26";
    for (let x = 142; x <= 760; x += 38) {
      ctx.beginPath(); ctx.moveTo(x, 34); ctx.lineTo(x, 367); ctx.stroke();
    }
    for (let y = 50; y <= 365; y += 38) {
      ctx.beginPath(); ctx.moveTo(142, y); ctx.lineTo(760, y); ctx.stroke();
    }
    // 边缘的连线和节点只作背景，中心曲线和三个关键点保持醒目。
    const clusters = [
      [[96, 244], [162, 185], [233, 226], [258, 158], [329, 137]],
      [[543, 302], [610, 333], [685, 290], [751, 321], [788, 257]],
      [[529, 83], [609, 47], [660, 93], [732, 59], [779, 125]],
    ];
    ctx.strokeStyle = "#a6b4fc6e";
    ctx.fillStyle = "#b0e3ffb5";
    for (const cluster of clusters) {
      ctx.beginPath();
      ctx.moveTo(...cluster[0]);
      for (const node of cluster.slice(1)) ctx.lineTo(...node);
      ctx.stroke();
      for (const [x, y] of cluster) {
        ctx.beginPath();
        ctx.arc(x, y, 2.5, 0, 2 * Math.PI);
        ctx.fill();
      }
    }
    ctx.strokeStyle = "#a394ff36";
    ctx.beginPath();
    ctx.ellipse(516, 200, 283, 138, -.23, 0, 2 * Math.PI);
    ctx.stroke();
    ctx.strokeStyle = "#88cffa2e";
    ctx.beginPath();
    ctx.ellipse(516, 200, 309, 159, -.23, 0, 2 * Math.PI);
    ctx.stroke();
    ctx.strokeStyle = "#bdb7fb82";
    ctx.setLineDash([5, 7]);
    ctx.beginPath(); ctx.moveTo(px(0), 28); ctx.lineTo(px(0), 368); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(143, py(1)); ctx.lineTo(760, py(1)); ctx.stroke();

    if (!Number.isFinite(vertex) || !(halfSpan > 0)) return;
    const gradient = ctx.createLinearGradient(195, 0, 735, 0);
    gradient.addColorStop(0, "#8e81f1");
    gradient.addColorStop(.58, "#d6bdff");
    gradient.addColorStop(1, "#8adeef");
    ctx.lineWidth = 4;
    ctx.strokeStyle = gradient;
    ctx.shadowBlur = 17;
    ctx.shadowColor = "#a494ff";
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const t = -1.54 + i * .0308;
      if (i === 0) ctx.moveTo(px(t), py(t));
      else ctx.lineTo(px(t), py(t));
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    for (const point of [-1, 0, 1]) {
      ctx.beginPath();
      ctx.arc(px(point), py(point), 13, 0, 2 * Math.PI);
      ctx.fillStyle = "#c8beff38";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(px(point), py(point), 5, 0, 2 * Math.PI);
      ctx.fillStyle = point === 0 ? "#e5ceff" : "#a0e8f2";
      ctx.fill();
    }
  }

  function resetReview() {

  function chapterFor(current) {

  function questionLevel(current) {
    return questionBank[current.variant]?.level ??
      (["rational", "g8-quadratic"].includes(current.topic) ? "basic" : "standard");
  }

  function generateQuestion(current) {

  function showSelection() {

  function setQuestion(nextSelection, next, sample = "") {

  function readAnswers() {
    if (!question) {
      message("请先填写课堂题目，并点击「使用这道题」。", true);

      .map(answer => answer.trim()).filter(Boolean);

      message("请录入 1–30 份匿名作答，每份之间空一行。", true);
      input.focus();

    }
    return answers;
  }

  function makePrompt(answers) {
    return [
      "请作为上海" + gradeNames[selection.grade] + "数学老师的讲评助手，逐份阅读以下匿名作答。找出第一处能从原文定位的问题，允许不同的正确解法。不根据答案猜测思路或动机。",
      "每份作答请另起一段，按下列四行用普通中文回答。保留原作答顺序与标题：",
      "第1份\n原文依据：逐字摘录学生的一句或一小段。找不到依据时填「依据不足」。\n可能错因：从下列选一项。\n建议追问：一句可以直接问学生的话。",
      "错因选项：" + Object.values(categories).join("、"),
      "只有结论或内容与题目无关时，选「依据不足，待追问」。不要在结果前后附加说明。",
      "题目：" + question.prompt,

      answers.map((answer, i) => "第" + (i + 1) + "份\n" + answer).join("\n\n"),
    ].join("\n\n");
  }

  function checkCommonError(text, rule) {
    // 只用作答中的明确推导做校验；数字结论单独出现时保留待追问。
    if (rule) {
      const normalized = text.normalize("NFKC").replace(/[−－]/g, "-");
      const roots = rule.type === "missing_root"
        ? [...normalized.matchAll(/(?:x\s*=\s*|或\s*)([+±-]?\s*\d+)(?![\d.])/gi)]
          .map(match => match[1].replace(/\s/g, "")) : [];
      for (const original of text.split(/[。；;！？!?\n]/u)) {
        const step = original.normalize("NFKC").replace(/[−－]/g, "-").replace(/\s+/g, "");
        if (/(?:不是|并非|错误|假设|如果|应改|不对|有人|误写|更正)/u.test(step)) continue;
        if (rule.type === "sign") {
          const sum = rule.negative + rule.positive;
          const wrongSign = sum < 0 ? "\\+?" + -sum : String(-sum);
          const expression = new RegExp("(?:^|[^0-9(])(?:\\(" + rule.negative + "\\)|" + rule.negative + ")\\+" + rule.positive + "=(?:\\()?" + wrongSign + "(?![\\d.])");
          if (sum !== 0 && expression.test(step)) {
            return { category: "sign", evidence: original, question: "两个数的绝对值谁更大？结果应该保留哪个数的符号？" };
          }
        }
        if (rule.type === "inequality") {
          const direction = new RegExp("x>" + rule.boundary + "(?![\\d.])", "i");
          const division = new RegExp("除以\\(?" + rule.coefficient + "(?![\\d.])");
          if (division.test(step) && direction.test(step)) {
            return { category: "inequality", evidence: original, question: "不等式两边同除以负数时，不等号应该朝哪边？" };
          }
        }
        if (rule.type === "missing_root" && /开(?:平)?方/u.test(step) && /x=/i.test(step) &&
            roots.length > 0 && roots.every(root => Number(root) === Number(roots[0]) && Math.abs(Number(root)) === rule.root) &&
            !/[±]|正负|或|两个/u.test(normalized)) {
          return { category: "missing_root", evidence: original, question: "还有哪个数平方后也等于右边？它能否代回原方程？" };
        }
      }
    }
    return { category: "uncertain", question: "你用到了哪个条件或性质？请补写从这一条件到结论的关键一步。" };
  }

  function checkWork(text) {
    if (!question.graph) return checkCommonError(text, question.diagnosisRule);
    const { a, b, c, xMax } = question.graph;
    const axis = -b / (2 * a);
    const clauses = text.split(/(?<=[。；;！!？?\n])/u);
    const number = "([+−－-]?[0-9]+(?:\\.[0-9]+)?)";
    const value = raw => Number(raw.replace(/[−－]/g, "-"));
    const followUp = selection.variant === "flight"
      ? "你用什么条件判断最高点和落地点？请写出关键一步。"
      : "你是怎样从式子求横轴交点和对称轴的？请写出关键一步。";

    // 只匹配能逐字引用的明确步骤；模糊、矛盾或无关文本交给教师追问。
    if (selection.variant === "flight") {
      const zeroIndex = clauses.findIndex(clause => /(?:令|设)\s*h\s*[=＝]\s*0\b/i.test(clause));
      const axisStep = clauses.find(clause => /对称轴/.test(clause) &&
        value(clause.match(new RegExp("t\\s*[=＝]\\s*" + number, "i"))?.[1] ?? "") === axis);
      const peakPattern = new RegExp(number + "\\s*(?:秒|s)\\s*(?:时|到达|达到)*\\s*(?:为|是)?\\s*最高", "i");
      const peakIndex = clauses.findIndex(clause => {
        const match = clause.match(peakPattern);
        return match && value(match[1]) === xMax && !/(?:不是|不在|并非|如果|假设)/.test(clause);
      });
      if (peakIndex >= 0 && axisStep) {
        const start = clauses.indexOf(axisStep);
        return { category: "inconsistent", evidence: clauses.slice(Math.min(start, peakIndex), Math.max(start, peakIndex) + 1).join(""),
          question: "你写的对称轴和最终答案不同。哪个时间对应顶点？" };
      }
      if (peakIndex >= zeroIndex && zeroIndex >= 0 && peakIndex <= zeroIndex + 1 &&
          /所以|因此|故/.test(clauses[peakIndex])) {
        return { category: "vertex_root", evidence: clauses.slice(zeroIndex, peakIndex + 1).join(""),
          question: "高度为零时小球在哪里？要找最高点，图上应该看哪里？" };
      }
    } else {
      const rootStep = clauses.find(clause => /(?:令|设)\s*y\s*[=＝]\s*0\b/i.test(clause));
      const axisPattern = new RegExp("对称轴(?:是|为)?[：:\\s]*x\\s*[=＝]\\s*" + number, "i");
      const axisStep = clauses.find(clause => {
        const match = clause.match(axisPattern);
        if (!match || /(?:不是|并非|如果|假设)/.test(clause)) return false;
        const x = value(match[1]);
        return x !== axis && Math.abs((a * x + b) * x + c) < 1e-8;
      });
      if (rootStep && axisStep) {
        const first = clauses.indexOf(rootStep);
        const second = clauses.indexOf(axisStep);
        return { category: "vertex_root", evidence: clauses.slice(Math.min(first, second), Math.max(first, second) + 1).join(""),
          question: "这两个交点关于哪条直线对称？怎样用两个横坐标找它？" };
      }
    }
    return { category: "uncertain", question: followUp };
  }

  function toRow(text, proposal, index) {
    // 模型输出与匿名作答逐字校验。缺字段或引用无效时保留待确认，由老师补充。
    const evidence = typeof proposal?.evidence === "string" ? proposal.evidence.trim() : "";
    const hasEvidence = Boolean(evidence && text.includes(evidence));
    const category = proposal?.category;
    const accepted = hasEvidence && typeof category === "string" && Object.hasOwn(categories, category);
    const followUp = typeof proposal?.question === "string" && (accepted || category === "uncertain")
      ? proposal.question.trim().slice(0, 300) : "";
    return {
      id: index + 1,
      text,
      evidence: hasEvidence ? evidence : "",
      category: accepted ? category : "uncertain",
      followUp,
      confirmed: false,
      selected: false,
    };
  }

  function loadReview(answers, proposals, source) {
    rows = answers.map((text, index) => toRow(text, proposals.get(index + 1), index));
    byId("diagnosis-source").textContent = source;
    cards.replaceChildren(...rows.map(renderCard));
    review.hidden = false;
    updateTally();
    byId("diagnosis-review-title").focus();
  }

  function updateTally() {
    const confirmed = rows.filter(row => row.confirmed);
    const selected = confirmed.filter(row => row.selected);
    const totals = new Map();
    for (const row of confirmed) totals.set(row.category, (totals.get(row.category) || 0) + 1);
    const detail = [...totals].sort((left, right) => right[1] - left[1])
      .map(([category, count]) => categories[category] + " " + count + " 份").join(" · ");
    byId("diagnosis-tally").textContent = "已复核 " + confirmed.length + "/" + rows.length
      + " 份 · 已选 " + selected.length + "/2 份" + (detail ? "｜" + detail : "");
    for (const [index, control] of [...cards.querySelectorAll("[data-case-select]")].entries()) {
      const row = rows[index];
      control.checked = row.selected;
      control.disabled = !row.confirmed || (!row.selected && selected.length === 2);
    }
    // 一份作答可以单独讲评，也可再选一份对照。
    project.disabled = selected.length === 0;
  }

  function renderCard(row) {
    const card = element("article", "diagnosis-case");
    const categoryLabel = element("label", "field-label", "可能错因");
    const category = element("select", "diagnosis-field");
    for (const [id, label] of Object.entries(categories)) {
      const option = element("option", "", label);
      option.value = id;
      category.append(option);
    }
    category.value = row.category;
    categoryLabel.append(category);
    const followUpLabel = element("label", "field-label", "建议追问");
    const followUp = element("textarea");
    followUp.value = row.followUp;
    followUp.rows = 2;
    followUp.maxLength = 300;
    followUpLabel.append(followUp);

    const confirmLabel = element("label", "case-toggle");
    const confirm = element("input");
    confirm.type = "checkbox";
    confirmLabel.append(confirm, document.createTextNode("已复核"));
    const chooseLabel = element("label", "case-toggle");
    const choose = element("input");
    choose.type = "checkbox";
    choose.dataset.caseSelect = "";
    chooseLabel.append(choose, document.createTextNode("选作讲评"));
    const actions = element("div", "diagnosis-actions");
    actions.append(confirmLabel, chooseLabel);

    function reopenReview() {
      // 修改已确认的结论或追问后须重新确认，避免把旧版本投到学生面前。
      row.confirmed = false;
      row.selected = false;
      confirm.checked = false;
      updateTally();
    }
    category.addEventListener("change", () => {
      row.category = category.value;
      reopenReview();
    });
    followUp.addEventListener("input", () => {
      row.followUp = followUp.value.trim();
      reopenReview();
    });
    confirm.addEventListener("change", () => {
      row.confirmed = confirm.checked;
      if (!row.confirmed) row.selected = false;
      updateTally();
    });
    choose.addEventListener("change", () => {
      row.selected = choose.checked;
      updateTally();
    });

    const original = element("blockquote", "diagnosis-original");
    if (row.evidence) {
      const index = row.text.indexOf(row.evidence);
      original.append(row.text.slice(0, index), element("mark", "", row.evidence), row.text.slice(index + row.evidence.length));
    } else {
      original.textContent = row.text;
    }
    const evidence = element("div");
    evidence.append(element("p", "diagnosis-evidence", row.evidence ? "原文依据已高亮" : "还需要学生补充解题依据"), original);
    const interpretation = element("div");
    interpretation.append(categoryLabel, followUpLabel);
    const body = element("div", "diagnosis-case-body");
    body.append(evidence, interpretation);
    card.append(element("h3", "", "第 " + row.id + " 份作答"), body, actions);
    return card;
  }

  function importReview() {
    if (!batch) {
      message("请先复制本次作答的分析材料，再贴回 AI 的回答。", true, transferStatus);
      return;
    }
    const proposals = new Map();
    const headings = [...resultBox.value.matchAll(/^\s*(?:#+\s*)?(?:\*\*)?第\s*(\d+)\s*份(?:作答)?(?:\*\*)?[：:]?[^\S\r\n]*$/gm)];
    for (const [index, heading] of headings.entries()) {
      const number = Number(heading[1]);
      const body = resultBox.value.slice(heading.index + heading[0].length, headings[index + 1]?.index);
      const readLine = label => body.match(new RegExp("^\\s*(?:[-*]\\s*)?(?:\\*\\*)?" + label + "(?:\\*\\*)?[：:]\\s*(?:\\*\\*)?([^\\r\\n]+)", "m"))?.[1]
        .trim().replace(/^[「“"]|[」”"]$/g, "") ?? "";
      const reason = readLine("可能错因");
      const category = Object.keys(categories).find(key => categories[key] === reason.replace(/[。.]$/, ""));
      if (number < 1 || number > batch.length || proposals.has(number)) {
        message("AI 的回答里有重复或不对应的作答。请让它按原顺序重新回答。", true, transferStatus);
        return;
      }
      if (category) proposals.set(number, { category, evidence: readLine("原文依据"), question: readLine("建议追问") });
    }
    if (!proposals.size) {
      message("没找到可复核的分析。请把 AI 的整段回答贴进来，或请它按分析材料中的格式重答。", true, transferStatus);
      return;
    }
    // 导入只接收对应作答的原文引文，缺漏和无法核对的结论回到待追问。
    loadReview(batch, proposals, "来自外部 AI 的建议。请核对原话，再选择要讲评的作答。");
    transfer.open = false;
  }

  function showPrintable(next, isRetest) {
    // 使用原试卷的预览、打印和 PDF 导出路径，题目和答案继续共享同一个题对象。
    const chapter = chapterFor(selection);
    gradeInput.value = selection.grade;
    termInput.value = chapter?.term ?? "上下册";
    renderTopics();
    if (chapter) {
      for (const box of topics.querySelectorAll("input")) box.checked = box.value === chapter.id;
    }
    const level = questionLevel(selection);
    form.querySelector('input[name="difficulty"][value="' + level + '"]').checked = true;
    countInput.value = "1";
    updateSelectAll();
    paper = {
      title: gradeNames[selection.grade] + (chapter?.label.replace(/^第\d+章\s*/, "") ?? "课堂题") + (isRetest ? "复测" : "诊断"),
      bookLabel: chapter ? "沪教版五·四学制 " + chapter.term : "教师自带题",
      difficultyLabel: chapter ? levels[level] : "",
      questions: [next],
    };
    mode = "student";
    renderPaper();
    showFormStatus("已载入讲评工作台的" + (isRetest ? "复测试卷。" : "诊断试卷。"));
    openView("paper", "print");
  }

  function renderGraph(focus) {
    const { a, b, c, xMin, xMax, xLabel = "x", yLabel = "y" } = question.graph;
    const vertex = -b / (2 * a);
    const evaluate = x => (a * x + b) * x + c;
    const rootOffset = Math.sqrt(b * b - 4 * a * c) / Math.abs(2 * a);
    const roots = [vertex - rootOffset, vertex + rootOffset].filter(x => x >= xMin && x <= xMax);
    const samples = [0, evaluate(xMin), evaluate(xMax), evaluate(vertex)];
    const low = Math.min(...samples);
    const high = Math.max(...samples);
    const pad = (high - low) * .12;
    const xLeft = Math.min(0, xMin) - (xMax - xMin) * .11;
    const xRight = Math.max(0, xMax) + (xMax - xMin) * .11;
    const px = x => 25 + 510 * (x - xLeft) / (xRight - xLeft);
    const py = y => 258 - 232 * (y - low + pad) / (high - low + 2 * pad);
    const svgNS = "http://www.w3.org/2000/svg";
    function shape(tag, attrs, text) {
      const node = document.createElementNS(svgNS, tag);
      for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, String(value));
      if (text) node.textContent = text;
      return node;
    }
    const line = (x1, y1, x2, y2, stroke, width) => shape("line", { x1, y1, x2, y2, stroke, "stroke-width": width });
    const label = (x, y, text, anchor = "start") => shape("text",
      { x, y, "text-anchor": anchor, fill: "#36304e", "font-size": 17, "font-weight": 650 }, text);
    const svg = shape("svg", { viewBox: "0 0 560 285", role: "img", "aria-label": "当前诊断题的抛物线" });
    svg.append(line(22, py(0), 536, py(0), "#726d89", 1.3), line(px(0), 19, px(0), 266, "#726d89", 1.3),
      label(534, Math.max(20, py(0) - 8), xLabel, "end"), label(px(0) + 7, 19, yLabel));

    // 仅绘制题目有效区间；抛物线、顶点与零点都从同一题目的参数计算。
    const points = Array.from({ length: 101 }, (_, index) => {
      const x = xMin + (xMax - xMin) * index / 100;
      return px(x) + "," + py(evaluate(x));
    });
    svg.append(shape("polyline", { points: points.join(" "), fill: "none", stroke: "#4934b6", "stroke-width": 3.5 }));
    if (focus === "vertex") {
      const axis = line(px(vertex), 23, px(vertex), 264, "#6b45c0", 1.5);
      axis.setAttribute("stroke-dasharray", "5 5");
      svg.append(axis, shape("circle", { cx: px(vertex), cy: py(evaluate(vertex)), r: 6, fill: "#4934b6" }));
    }
    if (focus === "roots") {
      for (const root of roots) svg.append(shape("circle", { cx: px(root), cy: py(0), r: 6, fill: "#ad421a" }));
    }
    byId("diagnosis-graph").replaceChildren(svg);
    for (const button of graphButtons) button.setAttribute("aria-pressed", String(button.dataset.graphFocus === focus));
    const fmt = n => Number(n.toFixed(2));
    const vertexText = "顶点（" + fmt(vertex) + "，" + fmt(evaluate(vertex)) + "），对称轴为 " + (selection.variant === "flight" ? "t" : "x") + " = " + fmt(vertex) + "。";
    const rootText = "横轴交点 " + roots.map(root => "（" + fmt(root) + "，0）").join("、")
      + (selection.variant === "flight" ? "，表示小球落地。" : "，它们的纵坐标为 0。");
    byId("graph-caption").textContent = focus === "vertex" ? vertexText
      : focus === "roots" ? rootText : "先请学生在图上指出顶点和横轴交点，再点击核对。";
  }

  byId("open-paper").addEventListener("click", () => openView("paper", "title"));
  byId("open-diagnosis").addEventListener("click", () => openView("diagnosis", "diagnosis-title"));
  byId("diagnosis-return").addEventListener("click", () => openView("diagnosis", "diagnosis-review-title"));
  function selectChapter(gradeValue, topicValue) {
    const next = { grade: gradeValue, topic: topicValue, variant: topicValue === quadratic.id ? "flight" : "bank" };
    setQuestion(next, topicValue === "custom" ? null : generateQuestion(next));
  }

  function anotherQuestion() {
    // 同一批复测使用同章、同难度题目，并避免和本次诊断题重复。
    for (let i = 0; i < 20; i++) {
      const next = generateQuestion(selection);
      if (next.prompt !== question.prompt &&
          (!question.diagnosisRule || next.diagnosisRule?.type === question.diagnosisRule.type)) return next;
    }
    return null;
  }

  grade.addEventListener("change", () => selectChapter(grade.value, initialTopics[grade.value]));
  topic.addEventListener("change", () => selectChapter(selection.grade, topic.value));
  variant.addEventListener("change", () => {
    const next = { ...selection, variant: variant.value };
    setQuestion(next, generateQuestion(next));
  });
  custom.addEventListener("submit", event => {
    event.preventDefault();
    const prompt = byId("diagnosis-custom-prompt").value.trim();
    if (!prompt) return byId("diagnosis-custom-prompt").focus();
    if (setQuestion(selection, { prompt, answer: byId("diagnosis-custom-answer").value.trim(), explanation: "", lines: 4 })) {
      byId("diagnosis-question").scrollIntoView({ block: "nearest" });
    }
  });
  byId("diagnosis-reroll").addEventListener("click", () => {
    const next = anotherQuestion();
    if (next) setQuestion(selection, next);
    else message("暂时没抽到新题，请再试一次。", true);
  });
  byId("diagnosis-print").addEventListener("click", () => showPrintable(question, false));
  input.addEventListener("input", resetReview);
  byId("diagnosis-check").addEventListener("click", () => {
    const answers = readAnswers();
    if (!answers) return;
    if (!question.graph && !question.diagnosisRule) {
      loadReview(answers, new Map(), "这道题可以由教师核对原话、填写错因，或从「其他分析方式」导入外部 AI 的建议。");
      return;
    }
    const proposals = new Map(answers.map((text, index) => [index + 1, checkWork(text)]));
    transfer.open = false;
    message("");
    loadReview(answers, proposals, "按题型检查常见错法。请核对原话，再选择要讲评的作答。");
  });
  byId("diagnosis-copy").addEventListener("click", async () => {
    const answers = readAnswers();
    if (!answers) return;
    batch = answers;
    promptBox.value = makePrompt(answers);
    try {
      await navigator.clipboard.writeText(promptBox.value);
      message("已复制。发给你常用的 AI 后，将整段回答贴回来。", false, transferStatus);
    } catch {
      // 扣子嵌入预览可能无法直接访问剪贴板，选中文本供老师自行复制。
      promptBox.hidden = false;
      byId("diagnosis-prompt-label").hidden = false;
      promptBox.focus();
      promptBox.select();
      message("请复制已选中的文字。", false, transferStatus);
    }
  });
  byId("diagnosis-import").addEventListener("click", importReview);
  byId("diagnosis-manual").addEventListener("click", () => {
    const answers = readAnswers();
    if (answers) loadReview(answers, new Map(), "填写并确认错因后，可选一到两份作答投屏。");
  });
  byId("diagnosis-example").addEventListener("click", () => {
    const answers = [
      "令 h = 0，解得 t = 7，所以 7 秒时最高，也在 7 秒时落地。",
      "对称轴是 t = 3。令 h = 0 得 t = 7。答：7 秒时最高，7 秒时落地。",
      "7 秒时最高，7 秒时落地。",
    ];
    if (!setQuestion({ grade: "9", topic: quadratic.id, variant: "flight" }, questionBank.flight.example(), answers.join("\n\n"))) return;
    byId("diagnosis-check").click();
  });
  project.addEventListener("click", () => {
    const selected = rows.filter(row => row.confirmed && row.selected);
    if (selected.length === 0) return;
    const chapter = chapterFor(selection);
    byId("projection-title").textContent = (chapter?.label.replace(/^第\d+章\s*/, "") ?? gradeNames[selection.grade]) + " · 课堂讲评";
    byId("projection-question").textContent = question.prompt;
    byId("projection-cases").replaceChildren(...selected.map((row, index) => {
      const card = element("article", "projection-case");
      card.append(element("h3", "", "解法 " + (index + 1)), element("blockquote", "diagnosis-original", row.text));
      if (row.followUp) card.append(element("p", "", row.followUp));
      return card;
    }));
    byId("projection-graph-card").hidden = !question.graph;
    byId("diagnosis-retest-card").hidden = !chapter;
    byId("diagnosis-custom-retest").hidden = Boolean(chapter);
    if (question.graph) renderGraph();
    openView("projection", "projection-title");
  });
  for (const button of graphButtons) button.addEventListener("click", () => renderGraph(button.dataset.graphFocus));
  byId("diagnosis-retest").addEventListener("click", () => {
    const next = anotherQuestion();
    if (next) showPrintable(next, true);
    else byId("diagnosis-retest-status").textContent = "暂时没抽到新题，请再试一次。";
  });
  byId("diagnosis-custom-retest-form").addEventListener("submit", event => {
    event.preventDefault();
    const field = byId("diagnosis-retest-prompt");
    if (!field.value.trim()) return field.focus();
    showPrintable({ prompt: field.value.trim(), answer: byId("diagnosis-retest-answer").value.trim(), explanation: "", lines: 4 }, true);
  });
  for (const [key, label] of Object.entries(variantLabels)) {
    const option = element("option", "", label);
    option.value = key;
    variant.append(option);
  }
  showSelection();
  renderQuestion();
})();

</script>
</body>
